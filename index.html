<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <title>Chore Board</title>
  <style>
    :root {
      --amy: #ec4899;
      --aiden: #3b82f6;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 { font-size: 1.3rem; }
    .status { font-size: 0.75rem; padding: 4px 8px; border-radius: 999px; }
    .status.on { background: #dcfce7; color: #166534; }
    .status.off { background: #fee2e2; color: #991b1b; }
    .legend { display: flex; gap: 12px; margin-bottom: 12px; font-size: 0.85rem; flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.amy { background: var(--amy); }
    .dot.aiden { background: var(--aiden); }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    button {
      font-family: inherit; font-size: 0.85rem; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--text); cursor: pointer;
    }
    button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    button.notif-on { background: #16a34a; color: #fff; border-color: #16a34a; }
    button.notif-off { background: #dc2626; color: #fff; border-color: #dc2626; }
    .board { display: grid; gap: 12px; }
    .day-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px;
    }
    .day-card h2 {
      font-size: 1rem; margin-bottom: 8px; padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    ul { list-style: none; }
    li {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    li:last-child { border-bottom: none; }
    li.done .task-name { text-decoration: line-through; color: var(--muted); }
    .task-name { flex: 1; min-width: 120px; font-size: 0.9rem; }
    .assignee {
      font-size: 0.75rem; padding: 3px 8px; border-radius: 999px;
      color: #fff; cursor: pointer; white-space: nowrap;
    }
    .assignee.amy { background: var(--amy); }
    .assignee.aiden { background: var(--aiden); }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: #4f46e5; }
    .freq-tag {
      font-size: 0.65rem; color: var(--muted); background: var(--bg);
      padding: 2px 6px; border-radius: 4px;
    }
    .row-tools { display: flex; gap: 6px; align-items: center; width: 100%; }
    select {
      font-family: inherit; font-size: 0.7rem; padding: 3px 4px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--card);
    }
    .star-btn {
      font-size: 0.9rem; padding: 2px 6px; background: none;
      border: none; cursor: pointer; opacity: 0.3;
    }
    .star-btn.active { opacity: 1; }
    .na-card {
      background: #f1f5f9; border: 1px dashed var(--border);
      border-radius: 12px; padding: 12px; margin-top: 4px;
    }
    .na-card h2 { font-size: 0.95rem; color: var(--muted); margin-bottom: 8px; }
    .na-card li { color: var(--muted); font-size: 0.82rem; }
    .na-next { font-size: 0.7rem; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>🧹 Chore Board</h1>
    <span id="status" class="status off">Connecting...</span>
  </header>

  <div class="legend">
    <span><span class="dot amy"></span> Amy</span>
    <span><span class="dot aiden"></span> Aiden</span>
    <span>⭐ Wildcard (tap star)</span>
  </div>

  <div class="controls">
    <button id="reassign" class="primary">Reassign Week</button>
    <button id="wildcardBtn">Set Wildcard Loser</button>
    <button id="notifyBtn" class="notif-off">Enable Reminders</button>
  </div>

  <div id="board" class="board"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAB9wJomz2H4vD-zodOTmXbFDk_kKrFKKI",
      authDomain: "chore-list-6ccc1.firebaseapp.com",
      databaseURL: "https://chore-list-6ccc1-default-rtdb.firebaseio.com",
      projectId: "chore-list-6ccc1",
      storageBucket: "chore-list-6ccc1.firebasestorage.app",
      messagingSenderId: "154741520458",
      appId: "1:154741520458:web:fa0145ead0cb5694698eb3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const statusEl = document.getElementById("status");
    const board = document.getElementById("board");
    const notifyBtn = document.getElementById("notifyBtn");

    const DAYS = ["Ponedjeljak","Utorak","Srijeda","Cetvrtak","Petak","Subota","Nedjelja"];
    const ASSIGNEES = ["Amy","Aiden"];
    const MONTHS = ["januar","februar","mart","april","maj","juni","juli","august","septembar","oktobar","novembar","decembar"];

    const TASKS = [
      { id: "d1", name: "Sudje", freq: "daily" },
      { id: "d2", name: "Dorucak", freq: "daily" },
      { id: "d3", name: "Rucak", freq: "daily" },
      { id: "d4", name: "Tuta", freq: "daily" },
      { id: "d5", name: "Masina za ves/susilica", freq: "daily" },
      { id: "d6", name: "Slaganje vesa", freq: "daily" },
      { id: "d7", name: "Zatezanje kreveta", freq: "daily" },
      { id: "d8", name: "Zatezanje stola/ugla i misc", freq: "daily" },
      { id: "d9", name: "Mijenjanje Cafkine vode", freq: "daily" },
      { id: "d10", name: "Punjenje elektronike", freq: "daily" },
      { id: "m1", name: "Ribanje sporeta", freq: "weekly", days: [1,4] },
      { id: "m2", name: "Mini-grocery", freq: "weekly", days: [2,5] },
      { id: "m3", name: "Usisavanje", freq: "weekly", days: [3,6] },
      { id: "m4", name: "Bacanje smeca", freq: "weekly", days: [0,2,4] },
      { id: "m5", name: "Ciscenje wc-a (solja, umivaonik)", freq: "weekly", days: [1,3,5] },
      { id: "w1", name: "Zalijevanje cvijeca", freq: "weekly", days: [5] },
      { id: "w2", name: "WC generalka (tus, odvod, podovi)", freq: "weekly", days: [6] },
      { id: "b1", name: "Mijenjanje posteljine", freq: "biweekly", days: [5] },
      { id: "mo1", name: "Pranje rerne", freq: "monthly", days: [5] },
      { id: "mo2", name: "Pranje prozora + store", freq: "monthly", days: [6] },
      { id: "mo3", name: "Pranje balkona (ljeti)", freq: "monthly", days: [5] },
      { id: "mo4", name: "Ciscenje ostave", freq: "monthly", days: [6] },
      { id: "mo5", name: "Usisavanje ispod/iza kauca i kreveta", freq: "monthly", days: [5] },
      { id: "mo6", name: "Pranje usisivaca", freq: "monthly", days: [6] },
      { id: "mo7", name: "Pranje auta", freq: "monthly", days: [5] },
      { id: "mo8", name: "Ciscenje frizidera", freq: "monthly", days: [6] },
      { id: "mo9", name: "Placanje racuna", freq: "monthly", days: [5] },
      { id: "q1", name: "Ciscenje odvoda (umivaonik)", freq: "quarterly", days: [6] }
    ];

    function getWeekNumber(d) {
      const date = new Date(d.getTime());
      date.setHours(0,0,0,0);
      date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
      const week1 = new Date(date.getFullYear(), 0, 4);
      return 1 + Math.round(((date - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    }

    const now = new Date();
    const currentWeek = getWeekNumber(now);
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();

    function firstWeekOfMonth(year, month) {
      return getWeekNumber(new Date(year, month, 1));
    }

    function appearsThisWeek(t) {
      switch(t.freq) {
        case "weekly": return true;
        case "biweekly": return currentWeek % 2 === 0;
        case "monthly": return firstWeekOfMonth(currentYear, currentMonth) === currentWeek;
        case "quarterly":
          return [0,3,6,9].includes(currentMonth) && firstWeekOfMonth(currentYear, currentMonth) === currentWeek;
        default: return true;
      }
    }

    // Human-readable next-due estimate
    function nextDue(t) {
      if (t.freq === "biweekly") {
        return currentWeek % 2 === 0 ? "ove sedmice" : "sljedece sedmice";
      }
      if (t.freq === "monthly") {
        const fw = firstWeekOfMonth(currentYear, currentMonth);
        if (currentWeek < fw) return "prva sedmica ovog mjeseca";
        const nm = (currentMonth + 1) % 12;
        return "prva sedmica u " + MONTHS[nm];
      }
      if (t.freq === "quarterly") {
        const quarters = [0,3,6,9];
        let nextQ = quarters.find(q => q > currentMonth);
        if (nextQ === undefined) nextQ = 0;
        return "prva sedmica u " + MONTHS[nextQ];
      }
      return "";
    }

    let state = null;

    db.ref("board/week" + currentWeek).on("value", (snap) => {
      statusEl.textContent = "Live";
      statusEl.classList.remove("off"); statusEl.classList.add("on");
      state = snap.val();
      if (!state) {
        state = generateWeek();
        db.ref("board/week" + currentWeek).set(state);
      }
      render();
    }, () => {
      statusEl.textContent = "Offline";
      statusEl.classList.remove("on"); statusEl.classList.add("off");
    });

    function makeItem(t, uid, assignee) {
      return { id: uid, taskId: t.id, name: t.name, freq: t.freq,
               assignee: assignee, done: false, wildcard: false };
    }

    function generateWeek() {
      const assignments = {};
      DAYS.forEach(d => assignments[d] = []);
      let toggle = Math.random() < 0.5 ? 0 : 1;

      TASKS.filter(t => t.freq === "daily").forEach(t => {
        DAYS.forEach(day => {
          assignments[day].push(makeItem(t, t.id + "_" + day, ASSIGNEES[toggle]));
          toggle = 1 - toggle;
        });
      });

      TASKS.filter(t => t.freq !== "daily").forEach(t => {
        if (!appearsThisWeek(t)) return;
        (t.days || [6]).forEach(di => {
          assignments[DAYS[di]].push(makeItem(t, t.id + "_" + di, ASSIGNEES[toggle]));
          toggle = 1 - toggle;
        });
      });

      // Wildcards: one from each person's pool, any task eligible
      const amyPool = [], aidenPool = [];
      DAYS.forEach(day => assignments[day].forEach(item => {
        if (item.assignee === "Amy") amyPool.push(item);
        else aidenPool.push(item);
      }));
      if (amyPool.length) amyPool[Math.floor(Math.random()*amyPool.length)].wildcard = true;
      if (aidenPool.length) aidenPool[Math.floor(Math.random()*aidenPool.length)].wildcard = true;

      return { assignments, week: currentWeek };
    }

    function save() { db.ref("board/week" + currentWeek).set(state); }

    function moveItem(item, fromDay, toDay) {
      const arr = state.assignments[fromDay];
      const i = arr.findIndex(x => x.id === item.id);
      if (i > -1) {
        const [moved] = arr.splice(i, 1);
        state.assignments[toDay].push(moved);
        save();
      }
    }

    function render() {
      board.innerHTML = "";
      DAYS.forEach(day => {
        const items = (state.assignments && state.assignments[day]) || [];
        if (items.length === 0) return;

        const card = document.createElement("div");
        card.className = "day-card";
        const h2 = document.createElement("h2");
        h2.textContent = day;
        card.appendChild(h2);

        const ul = document.createElement("ul");
        items.forEach(item => {
          const li = document.createElement("li");
          if (item.done) li.classList.add("done");

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = item.done;
          cb.addEventListener("change", () => { item.done = cb.checked; save(); });

          const nameWrap = document.createElement("div");
          nameWrap.className = "task-name";
          nameWrap.textContent = (item.wildcard ? "⭐ " : "") + item.name;
          const freqTag = document.createElement("span");
          freqTag.className = "freq-tag";
          freqTag.textContent = item.freq;
          nameWrap.appendChild(document.createTextNode(" "));
          nameWrap.appendChild(freqTag);

          const badge = document.createElement("span");
          badge.className = "assignee " + item.assignee.toLowerCase();
          badge.textContent = item.assignee;
          badge.addEventListener("click", () => {
            item.assignee = item.assignee === "Amy" ? "Aiden" : "Amy";
            save();
          });

          li.appendChild(cb);
          li.appendChild(nameWrap);
          li.appendChild(badge);

          // Tools row: star on ALL tasks; day-mover only for non-daily
          const tools = document.createElement("div");
          tools.className = "row-tools";

          const star = document.createElement("button");
          star.className = "star-btn" + (item.wildcard ? " active" : "");
          star.textContent = "⭐";
          star.title = "Toggle wildcard";
          star.addEventListener("click", () => { item.wildcard = !item.wildcard; save(); });
          tools.appendChild(star);

          if (item.freq !== "daily") {
            const sel = document.createElement("select");
            DAYS.forEach(d => {
              const opt = document.createElement("option");
              opt.value = d; opt.textContent = d;
              if (d === day) opt.selected = true;
              sel.appendChild(opt);
            });
            sel.addEventListener("change", () => moveItem(item, day, sel.value));
            tools.appendChild(sel);
          }

          li.appendChild(tools);
          ul.appendChild(li);
        });
        card.appendChild(ul);
        board.appendChild(card);
      });

      renderNotDue();
    }

    // Safety section: non-daily tasks not due this week
    function renderNotDue() {
      const notDue = TASKS.filter(t => t.freq !== "daily" && !appearsThisWeek(t));
      if (notDue.length === 0) return;

      const card = document.createElement("div");
      card.className = "na-card";
      const h2 = document.createElement("h2");
      h2.textContent = "Nije za ovu sedmicu";
      card.appendChild(h2);

      const ul = document.createElement("ul");
      notDue.forEach(t => {
        const li = document.createElement("li");
        const nameWrap = document.createElement("div");
        nameWrap.className = "task-name";
        nameWrap.textContent = t.name + " ";
        const freqTag = document.createElement("span");
        freqTag.className = "freq-tag";
        freqTag.textContent = t.freq;
        nameWrap.appendChild(freqTag);
        const next = document.createElement("div");
        next.className = "na-next";
        next.textContent = "sljedeci put: " + nextDue(t);
        nameWrap.appendChild(next);
        li.appendChild(nameWrap);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      board.appendChild(card);
    }

    document.getElementById("reassign").addEventListener("click", () => {
      if (confirm("Reassign all tasks for this week?")) {
        state = generateWeek();
        save();
      }
    });

    document.getElementById("wildcardBtn").addEventListener("click", () => {
      const loser = prompt("Who lost the game this week? Type Amy or Aiden");
      if (!loser) return;
      const name = loser.trim().toLowerCase() === "amy" ? "Amy" : "Aiden";
      DAYS.forEach(day => state.assignments[day].forEach(item => {
        if (item.wildcard) item.assignee = name;
      }));
      save();
      alert(name + " gets both wildcard tasks this week.");
    });

    function setNotifState(on) {
      if (on) {
        notifyBtn.textContent = "Reminders On";
        notifyBtn.classList.remove("notif-off"); notifyBtn.classList.add("notif-on");
      } else {
        notifyBtn.textContent = "Enable Reminders";
        notifyBtn.classList.remove("notif-on"); notifyBtn.classList.add("notif-off");
      }
      localStorage.setItem("remindersOn", on ? "1" : "0");
    }

    notifyBtn.addEventListener("click", async () => {
      const currentlyOn = localStorage.getItem("remindersOn") === "1";
      if (currentlyOn) { setNotifState(false); return; }
      if (!("Notification" in window)) { alert("Notifications not supported."); return; }
      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        setNotifState(true);
        new Notification("Chore Board", { body: "Reminders enabled!" });
      } else { setNotifState(false); }
    });

    setNotifState(localStorage.getItem("remindersOn") === "1");
  </script>
</body>
</html>
