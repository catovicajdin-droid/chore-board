<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">
  <title>Chore Board</title>
  <style>
    :root {
      --amy: #ec4899; --aiden: #3b82f6; --bg: #f8fafc;
      --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --accent: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      padding: 12px; -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
    }
    h1 { font-size: 1.2rem; }
    .status { font-size: 0.7rem; padding: 4px 8px; border-radius: 999px; }
    .status.on { background: #dcfce7; color: #166534; }
    .status.off { background: #fee2e2; color: #991b1b; }

    /* Week Navigation */
    .week-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; background: var(--card); padding: 8px;
      border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px;
    }
    .week-nav button { padding: 4px 12px; font-weight: bold; }
    .week-label { font-weight: bold; font-size: 0.9rem; }

    /* Points & Rewards */
    .reward-bar {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; margin-bottom: 12px;
    }
    .score-summary { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; }
    .progress-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
    .progress-fill { background: #22c55e; height: 100%; transition: width 0.4s ease; width: 0%; }
    .reward-status { font-size: 0.8rem; margin-top: 6px; font-weight: bold; color: #16a34a; display: none; }
    .reward-status.active { display: block; }

    .legend { display: flex; gap: 8px; margin-bottom: 12px; font-size: 0.75rem; flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.amy { background: var(--amy); }
    .dot.aiden { background: var(--aiden); }

    .controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    button {
      font-family: inherit; font-size: 0.8rem; padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--text); cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

    .board { display: grid; gap: 12px; }
    .day-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; position: relative;
    }
    .day-card.today { border: 2px solid var(--accent); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }
    .today-tag {
      position: absolute; top: -10px; right: 10px; background: var(--accent);
      color: white; font-size: 0.65rem; padding: 2px 8px; border-radius: 999px;
    }
    .day-card h2 { font-size: 0.95rem; margin-bottom: 8px; border-bottom: 1px solid var(--border); }

    ul { list-style: none; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    li.done .task-name { text-decoration: line-through; color: var(--muted); }
    .task-name { flex: 1; min-width: 120px; font-size: 0.85rem; }
    .assignee { font-size: 0.7rem; padding: 2px 6px; border-radius: 999px; color: #fff; cursor: pointer; }
    .assignee.amy { background: var(--amy); }
    .assignee.aiden { background: var(--aiden); }
    .assignee.locked { opacity: 0.7; cursor: not-allowed; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    .freq-tag { font-size: 0.6rem; color: var(--muted); background: var(--bg); padding: 1px 4px; border-radius: 4px; }
    .time-tag { font-size: 0.6rem; color: #4338ca; background: #eef2ff; padding: 1px 4px; border-radius: 4px; }
    .pass-btn { font-size: 0.8rem; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); background: #fef9c3; }
    .row-tools { display: flex; gap: 4px; align-items: center; width: 100%; margin-top: 4px; }
    .na-card { background: #f1f5f9; border: 1px dashed var(--border); border-radius: 12px; padding: 12px; margin-top: 4px; }
    .na-card h2 { font-size: 0.9rem; color: var(--muted); }
    .na-card li { font-size: 0.75rem; color: var(--muted); }

    .settings { display: none; padding: 12px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
    .settings.active { display: block; }
    .set-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1>🧹 Chore Board</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="viewToggle">⚙ Settings</button>
      <span id="status" class="status off">...</span>
    </div>
  </header>

  <div id="mainView">
    <!-- Week Navigation -->
    <div class="week-nav">
      <button id="prevWeek">◀</button>
      <div class="week-label" id="weekLabel">Week --</div>
      <button id="nextWeek">▶</button>
    </div>

    <!-- Reward Bar -->
    <div class="reward-bar">
      <div class="score-summary">
        <span>Weekly Points: <strong id="totalPoints">0</strong></span>
        <span>Goal: <strong id="goalText">100</strong></span>
      </div>
      <div class="progress-bg"><div id="progressBar" class="progress-fill"></div></div>
      <div id="rewardMsg" class="reward-status">🎁 Reward Unlocked!</div>
    </div>

    <div class="legend">
      <span><span class="dot amy"></span> Amy</span>
      <span><span class="dot aiden"></span> Aiden</span>
      <span>⭐ Wildcard</span>
      <span>→ Pass</span>
    </div>

    <div class="controls">
      <button id="reassign" class="primary">Reassign Week</button>
      <button id="wildcardBtn">Set Wildcard Loser</button>
    </div>

    <div id="board" class="board"></div>
  </div>

  <div id="settingsView" class="settings">
    <div class="set-card">
      <h2 style="font-size: 1rem; margin-bottom: 12px;">Reward Settings</h2>
      <div class="set-row">
        <span>Point Goal</span>
        <input type="number" id="goalInput" style="width:60px; padding:4px;" value="100">
      </div>
      <h2 style="font-size: 1rem; margin: 16px 0 8px;">Task Times</h2>
      <div id="settingsList"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAB9wJomz2H4vD-zodOTmXbFDk_kKrFKKI",
      authDomain: "chore-list-6ccc1.firebaseapp.com",
      databaseURL: "https://chore-list-6ccc1-default-rtdb.firebaseio.com",
      projectId: "chore-list-6ccc1",
      storageBucket: "chore-list-6ccc1.firebasestorage.app",
      messagingSenderId: "154741520458",
      appId: "1:154741520458:web:fa0145ead0cb5694698eb3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const board = document.getElementById("board");

    const DAYS = ["Ponedjeljak","Utorak","Srijeda","Cetvrtak","Petak","Subota","Nedjelja"];
    const ASSIGNEES = ["Amy","Aiden"];
    const LOCKED = { "d4": "Aiden" };

    // Point Values
    const POINTS = { daily: 1, weekly: 5, biweekly: 10, monthly: 15, quarterly: 20 };

    const TASKS = [
      { id: "d1", name: "Sudje", freq: "daily" },
      { id: "d2", name: "Dorucak", freq: "daily" },
      { id: "d3", name: "Rucak", freq: "daily" },
      { id: "d4", name: "Tuta", freq: "daily" },
      { id: "d5", name: "Masina za ves/susilica", freq: "daily" },
      { id: "d6", name: "Slaganje vesa", freq: "daily" },
      { id: "d7", name: "Zatezanje kreveta", freq: "daily" },
      { id: "d8", name: "Zatezanje stola/ugla i misc", freq: "daily" },
      { id: "d9", name: "Mijenjanje Cafkine vode", freq: "daily" },
      { id: "d10", name: "Punjenje elektronike", freq: "daily" },
      { id: "m1", name: "Ribanje sporeta", freq: "weekly", days: [1,4] },
      { id: "m2", name: "Mini-grocery", freq: "weekly", days: [2,5] },
      { id: "m3", name: "Usisavanje", freq: "weekly", days: [3,6] },
      { id: "m4", name: "Bacanje smeca", freq: "weekly", days: [0,2,4] },
      { id: "m5", name: "Ciscenje wc-a (solja, umivaonik)", freq: "weekly", days: [1,3,5] },
      { id: "w1", name: "Zalijevanje cvijeca", freq: "weekly", days: [5] },
      { id: "w2", name: "WC generalka (tus, odvod, podovi)", freq: "weekly", days: [6] },
      { id: "b1", name: "Mijenjanje posteljine", freq: "biweekly", days: [5] },
      { id: "mo1", name: "Pranje rerne", freq: "monthly", days: [5] },
      { id: "mo2", name: "Pranje prozora + store", freq: "monthly", days: [6] },
      { id: "mo3", name: "Pranje balkona (ljeti)", freq: "monthly", days: [5] },
      { id: "mo4", name: "Ciscenje ostave", freq: "monthly", days: [6] },
      { id: "mo5", name: "Usisavanje ispod/iza kauca i kreveta", freq: "monthly", days: [5] },
      { id: "mo6", name: "Pranje usisivaca", freq: "monthly", days: [6] },
      { id: "mo7", name: "Pranje auta", freq: "monthly", days: [5] },
      { id: "mo8", name: "Ciscenje frizidera", freq: "monthly", days: [6] },
      { id: "mo9", name: "Placanje racuna", freq: "monthly", days: [5] },
      { id: "q1", name: "Ciscenje odvoda (umivaonik)", freq: "quarterly", days: [6] }
    ];

    function getWeekNumber(d) {
      const date = new Date(d.getTime());
      date.setHours(0,0,0,0);
      date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
      const week1 = new Date(date.getFullYear(), 0, 4);
      return 1 + Math.round(((date - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    }

    const realNow = new Date();
    const realWeek = getWeekNumber(realNow);
    const todayIndex = (realNow.getDay() + 6) % 7; // Mon=0

    let displayedWeek = realWeek;
    let state = null;
    let times = {};
    let pointGoal = 100;

    // Load Settings
    db.ref("settings").on("value", (snap) => {
      const s = snap.val() || {};
      times = s.times || {};
      pointGoal = s.goal || 100;
      document.getElementById("goalInput").value = pointGoal;
      document.getElementById("goalText").textContent = pointGoal;
      if (state) render();
    });

    function loadWeek(w) {
      db.ref("board/week" + w).on("value", (snap) => {
        state = snap.val();
        document.getElementById("weekLabel").textContent = "Week " + w + (w === realWeek ? " (Current)" : "");
        if (!state && w === realWeek) {
          state = generateWeek();
          db.ref("board/week" + w).set(state);
        }
        render();
      });
    }

    function generateWeek() {
      const assignments = {};
      DAYS.forEach(d => assignments[d] = []);
      let toggle = Math.random() < 0.5 ? 0 : 1;
      TASKS.filter(t => t.freq === "daily").forEach(t => {
        DAYS.forEach(day => {
          const forced = LOCKED[t.id];
          assignments[day].push({ id: t.id + "_" + day, taskId: t.id, name: t.name, freq: t.freq, assignee: forced || ASSIGNEES[toggle], done: false });
          if (!forced) toggle = 1 - toggle;
        });
      });
      // Simplified "appears this week" check for generation
      TASKS.filter(t => t.freq !== "daily").forEach(t => {
        (t.days || [6]).forEach(di => {
           assignments[DAYS[di]].push({ id: t.id + "_" + di, taskId: t.id, name: t.name, freq: t.freq, assignee: ASSIGNEES[toggle], done: false });
           toggle = 1 - toggle;
        });
      });
      return { assignments, week: displayedWeek };
    }

    function render() {
      board.innerHTML = "";
      let totalPts = 0;

      DAYS.forEach((day, di) => {
        const items = (state && state.assignments && state.assignments[day]) || [];
        if (items.length === 0) return;

        const card = document.createElement("div");
        card.className = "day-card" + (di === todayIndex && displayedWeek === realWeek ? " today" : "");
        if (di === todayIndex && displayedWeek === realWeek) {
          const tag = document.createElement("div"); tag.className = "today-tag"; tag.textContent = "TODAY";
          card.appendChild(tag);
        }

        const h2 = document.createElement("h2"); h2.textContent = day;
        card.appendChild(h2);

        const ul = document.createElement("ul");
        items.forEach(item => {
          if (item.done) totalPts += (POINTS[item.freq] || 0);

          const li = document.createElement("li");
          if (item.done) li.classList.add("done");

          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = item.done;
          cb.addEventListener("change", () => { item.done = cb.checked; db.ref("board/week" + displayedWeek).set(state); });

          const nameWrap = document.createElement("div");
          nameWrap.className = "task-name";
          nameWrap.textContent = (item.wildcard ? "⭐ " : "") + item.name;

          const badge = document.createElement("span");
          badge.className = "assignee " + item.assignee.toLowerCase() + (LOCKED[item.taskId] ? " locked" : "");
          badge.textContent = item.assignee;

          li.appendChild(cb);
          li.appendChild(nameWrap);
          li.appendChild(badge);
          ul.appendChild(li);
        });
        card.appendChild(ul);
        board.appendChild(card);
      });

      // Update Points Bar
      document.getElementById("totalPoints").textContent = totalPts;
      const progress = Math.min(100, (totalPts / pointGoal) * 100);
      document.getElementById("progressBar").style.width = progress + "%";
      document.getElementById("rewardMsg").classList.toggle("active", totalPts >= pointGoal);
    }

    document.getElementById("prevWeek").addEventListener("click", () => { displayedWeek--; loadWeek(displayedWeek); });
    document.getElementById("nextWeek").addEventListener("click", () => { displayedWeek++; loadWeek(displayedWeek); });
    document.getElementById("goalInput").addEventListener("change", (e) => { db.ref("settings/goal").set(parseInt(e.target.value)); });

    document.getElementById("viewToggle").addEventListener("click", () => {
       document.getElementById("settingsView").classList.toggle("active");
       document.getElementById("mainView").style.display = document.getElementById("settingsView").classList.contains("active") ? "none" : "block";
    });

    loadWeek(realWeek);
  </script>
</body>
</html>
